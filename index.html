<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سیرجان پوش - پنل مدیریت هوشمند</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Bold.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Black.woff2') format('woff2');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }

        * {
            font-family: 'Vazirmatn', Tahoma, sans-serif !important;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
            letter-spacing: 0 !important;
            word-spacing: 0 !important;
        }
        
        body {
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 
           Improved Printing Strategy:
        */
        @media print {
            @page {
                size: A5 portrait;
                margin: 0;
            }
            
            /* Hide UI components using visibility to keep layout flow if needed, 
               but effectively remove them from the print canvas. */
            .no-print, header, aside, .saving-loader {
                display: none !important;
            }

            body {
                background: #fff !important;
            }

            #root {
                margin: 0 !important;
                padding: 0 !important;
            }

            /* The core fix: Make the printable area dominant */
            #printable-invoice {
                visibility: visible !important;
                display: flex !important;
                position: fixed !important;
                left: 0 !important;
                top: 0 !important;
                width: 148mm !important;
                height: 210mm !important;
                margin: 0 !important;
                padding: 10mm !important;
                background: #fff !important;
                z-index: 999999 !important;
                border: none !important;
                box-shadow: none !important;
            }

            /* Ensure everything else is hidden */
            body > *:not(#root), #root > *:not(main), main *:not(#printable-invoice) {
                visibility: hidden !important;
                height: 0 !important;
                overflow: hidden !important;
            }
        }

        .invoice-preview-container {
            width: 148mm;
            height: 210mm;
            background: white;
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 10mm;
            direction: rtl;
            overflow: hidden;
            border: 1px solid #eee;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        @media (max-width: 160mm) {
            .invoice-preview-wrapper {
                padding: 1rem;
                display: flex;
                justify-content: center;
                overflow-x: auto;
            }
            .invoice-preview-container {
                transform: scale(0.65);
                transform-origin: top center;
                margin-bottom: -70mm;
                flex-shrink: 0;
            }
        }

        .rtl-fix {
            direction: rtl !important;
            text-align: right !important;
        }
    </style>

{
  "imports": {

  }
}
</script>
