
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سیرجان پوش - پنل مدیریت هوشمند</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Bold.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Black.woff2') format('woff2');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }

        * {
            font-family: 'Vazirmatn', Tahoma, sans-serif !important;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            box-sizing: border-box;
        }
        body {
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Print Specific Styles - Robust A5 Single Page */
        @media print {
            @page {
                size: A5 portrait;
                margin: 0;
            }
            html, body {
                width: 148mm;
                height: 210mm;
                margin: 0 !important;
                padding: 0 !important;
                background: white;
            }
            /* Hide everything by default using opacity/display to avoid breaking html2canvas clones */
            body > *:not(#root) { display: none !important; }
            #root > div:not(.invoice-print-container) { display: none !important; }
            
            .no-print {
                display: none !important;
            }
            
            #printable-invoice {
                visibility: visible !important;
                display: flex !important;
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 148mm !important;
                height: 210mm !important;
                margin: 0 !important;
                padding: 10mm !important;
                border: none !important;
                box-shadow: none !important;
                background: white !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }

        .invoice-preview-container {
            width: 148mm;
            height: 210mm;
            background: white;
            margin: 0 auto;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
            position: relative;
            font-family: 'Vazirmatn', sans-serif !important;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 10mm;
        }
        
        @media (max-width: 160mm) {
            .invoice-preview-wrapper {
                padding: 1rem;
                display: flex;
                justify-content: center;
                overflow-x: auto;
            }
            .invoice-preview-container {
                transform: scale(0.6);
                transform-origin: top center;
                margin-bottom: -80mm;
                flex-shrink: 0;
            }
        }

        .saving-loader {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            color: white;
            padding: 1rem 2rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: 900;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            white-space: nowrap;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "recharts": "https://esm.sh/recharts@2.12.7",
    "xlsx": "https://esm.sh/xlsx@0.18.5",
    "html2canvas": "https://esm.sh/html2canvas@1.4.1",
    "jspdf": "https://esm.sh/jspdf@2.5.1",
    "@neondatabase/serverless": "https://esm.sh/@neondatabase/serverless@1.0.2",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
